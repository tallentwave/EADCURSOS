org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ============ CONFIGURE AQUI (é o único arquivo que você precisa editar) ============
# Endereço do seu site, com https e SEM barra no final (se estiver em subpasta, inclua: https://site.com.br/ead)
SITE_URL=https://seudominio.com.br
# Nome que aparece embaixo do ícone no celular (evite aspas e apóstrofos)
APP_NAME=Minha EAD
# Identificador único do app (não pode mudar depois de publicado)
APP_ID=br.com.eadcursos.app
# true só para testar em servidor http:// (nunca publique assim)
ALLOW_HTTP=false
# true = BARRA print e gravação de tela dentro do app (a miniatura na lista de apps também fica preta)
SECURE_SCREEN=true
# true = só as telas do CERTIFICADO e da CARTEIRINHA liberam o print (para o aluno guardar/mostrar o documento);
# todo o resto (vídeos, aulas, provas) continua protegido. false = nenhuma tela libera print.
SECURE_ALLOW_DOCS=true
